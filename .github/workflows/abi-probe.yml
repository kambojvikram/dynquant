# TEMPORARY. Delete once the compiler for the wheel matrix is settled.
#
# 0.5.1's first build was blocked by the ABI gate on `_ZSt21ios_base_library_initv`
# -- GLIBCXX_3.4.32, new in GCC 13 -- after pinning gcc-toolset-13 to escape GCC 14's
# `__cxa_call_terminate`. Rather than guess the next compiler and pay a ten-minute
# build per guess, this asks the build images directly: which toolsets exist, and
# which of them link a C++ translation unit that the image's own libstdc++ can
# satisfy. A compiler passes here only if it needs nothing newer than the target.

name: ABI probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "cuda 12.6 image"
            image: "sameli/manylinux_2_34_x86_64_cuda_12.6@sha256:be84b5937b2f6e02ee584226e54394976026b5f4489de113d3f2df2171a74b62"
          - label: "cuda 12.8 image"
            image: "sameli/manylinux_2_34_x86_64_cuda_12.8@sha256:3ff78728c35eb6522a97d1fbf507d7faacfc402df6678ca49cc78a7ba5289bf6"
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: interrogate the toolchain
        run: |
          # -i is load-bearing: without it docker leaves stdin unattached, `bash -s`
          # reads EOF, exits 0, and the step goes green having run nothing.
          docker run --rm -i "${{ matrix.image }}" bash -s <<'PROBE' | tee /tmp/probe.out
          set -u
          echo "### image"
          head -2 /etc/os-release

          SYSLIB=$(ls /usr/lib64/libstdc++.so.6.0.* 2>/dev/null | tail -1)
          echo "system libstdc++ : ${SYSLIB:-NONE}"
          if [ -n "${SYSLIB:-}" ]; then
            echo "  tops out at    : $(strings "$SYSLIB" | grep -oE 'GLIBCXX_[0-9.]+' | sort -uV | tail -1)"
            nm -D --defined-only "$SYSLIB" | awk '{print $NF}' | sed 's/@.*//' | sort -u > /tmp/have.txt
            nm -D --defined-only /lib64/libc.so.6      | awk '{print $NF}' | sed 's/@.*//' >> /tmp/have.txt
            nm -D --defined-only /lib64/libgcc_s.so.1  | awk '{print $NF}' | sed 's/@.*//' >> /tmp/have.txt
            sort -u -o /tmp/have.txt /tmp/have.txt
          else
            : > /tmp/have.txt
          fi

          echo
          echo "### toolsets present"
          ls -d /opt/rh/* 2>/dev/null || echo "  (no /opt/rh)"

          # A translation unit that exercises the three things that drag in modern
          # libstdc++: iostream static init (the GCC 13 symbol), a stringstream, and
          # an exception cleanup path (the GCC 14 symbol).
          cat > /tmp/t.cpp <<'CPP'
          #include <iostream>
          #include <sstream>
          #include <stdexcept>
          #include <string>
          #include <vector>
          extern "C" void probe(const char* s) {
            std::vector<std::string> v;
            std::ostringstream os;
            os << s << 1 << 2.5;
            v.push_back(os.str());
            try {
              if (v.back().size() > 100) throw std::runtime_error(v.back());
            } catch (const std::exception& e) {
              std::cerr << e.what() << std::endl;
            }
          }
          CPP

          echo
          for CXXP in /usr/bin/g++ \
                      /opt/rh/gcc-toolset-11/root/usr/bin/g++ \
                      /opt/rh/gcc-toolset-12/root/usr/bin/g++ \
                      /opt/rh/gcc-toolset-13/root/usr/bin/g++ \
                      /opt/rh/gcc-toolset-14/root/usr/bin/g++ ; do
            if [ ! -x "$CXXP" ]; then echo "== ${CXXP}: ABSENT"; echo; continue; fi
            echo "== ${CXXP}: GCC $("$CXXP" -dumpfullversion 2>/dev/null || "$CXXP" -dumpversion)"
            echo "   libstdc++.so resolves to : $("$CXXP" -print-file-name=libstdc++.so)"
            echo "   nonshared archive        : $("$CXXP" -print-file-name=libstdc++_nonshared.a)"
            rm -f /tmp/t.so
            if ! "$CXXP" -O2 -fPIC -shared -std=c++17 /tmp/t.cpp -o /tmp/t.so 2>/tmp/err.txt; then
              echo "   COMPILE FAILED: $(head -2 /tmp/err.txt)"; echo; continue
            fi
            echo "   versioned needs          : $(objdump -p /tmp/t.so | grep -oE '(GLIBCXX|CXXABI)_[0-9.]+' | sort -uV | tr '\n' ' ')"
            nm -D --undefined-only /tmp/t.so | awk '{print $NF}' | grep -v '@' \
              | grep -E '^(_ZSt|_ZNSt|_ZNKSt|__cxa_|__cxx_|__gxx_|_ZTVSt|_ZTISt)' | sort -u > /tmp/u.txt
            MISSING=$(comm -23 /tmp/u.txt /tmp/have.txt | tr '\n' ' ')
            echo "   unversioned + MISSING    : ${MISSING:-none}"
            if [ -z "$MISSING" ]; then echo "   VERDICT: usable"; else echo "   VERDICT: would ship a dead wheel"; fi
            echo
          done
          PROBE
          grep -q 'VERDICT' /tmp/probe.out || { echo '::error::probe produced no verdicts -- it did not run'; exit 1; }
