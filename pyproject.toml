# Repo-root tooling configuration for the DynQuant monorepo.
#
# This file intentionally declares NO [project] table -- it is not a
# distribution. The installable distributions live under packages/:
#
#   packages/dynquant-core/     -> import package `dynquant`      (pure Python)
#   packages/dynquant-kernels/  -> import package `dynquant_kernels` (CUDA C++)
#   packages/dynquant/          -> meta-distribution `dynquant`   (no code)
#
# Local dev install:
#   pip install -e packages/dynquant-core[dev]
#   pip install -e packages/dynquant-kernels    # needs nvcc + cmake

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "dynquant_paper",
    "fine-tuning_and_stats_hook",
    "inference",
    "pipeline",
    "**/_legacy/**",
    "**/_cutlass/**",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "TID",  # tidy imports
    "PTH",  # use pathlib
    # Blind `except Exception` is load-bearing in exactly two places -- backend
    # detection and `dynquant doctor` -- because both exist to survive a broken
    # install, and both are annotated with why. Selecting the rule makes every
    # *other* one visible instead of letting the pattern spread by imitation.
    "BLE",  # blind except
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function call in default argument (torch idioms)
    "N812",    # lowercase imported as non-lowercase (`import torch.nn.functional as F`)
    "SIM108",  # ternary is not always more readable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]
"**/csrc/**" = ["ALL"]

[tool.ruff.lint.isort]
# Without this, `dynquant` sorts as third-party and lands in the same block as
# pytest, which hides at a glance whether a test is exercising the package or its
# dependencies. `_oracle` and `_sglang_stub` are test-local helper modules, not
# distributions -- and `_sglang_stub` in particular must not sort next to a real
# `sglang` import, since the whole point of the file is that it is not one.
known-first-party = ["dynquant", "dynquant_kernels"]
known-local-folder = ["_oracle", "_sglang_stub"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false   # torch decorators are untyped
files = ["packages/dynquant-core/src/dynquant"]
exclude = "(_legacy|_cutlass)"
# `transformers` ships `py.typed` but annotates almost none of its constructors, so
# `GenerationConfig(...)` -- the one call the decode neutrality work depends on -- is a
# call to an untyped function. Ignoring it per-call-site would put a `type: ignore` on
# every future transformers call and train us to add them without reading; naming the
# package once here keeps `disallow_untyped_calls` sharp for our own code, which is
# what it is for. Scoped to transformers alone, not to third-party code generally.
untyped_calls_exclude = ["transformers"]

[[tool.mypy.overrides]]
# Third-party packages without complete stubs. `langdetect` and `nltk` are the IFEval
# scorer's two optional backends: absent on the `types` runner, untyped where present,
# and both already imported inside a `try` that has a documented fallback.
module = [
    "safetensors.*",
    "transformers.*",
    "peft.*",
    "trl.*",
    "yaml.*",
    "datasets.*",
    "dynquant_kernels.*",
    "langdetect.*",
    "nltk.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `transformers/__init__.py` is a `_LazyModule`: its public names are re-exported
# implicitly, so strict mode's `no_implicit_reexport` rejects `from transformers import
# GenerationConfig` as "not explicitly exported". The alternative is importing from the
# defining module (`transformers.generation.configuration_utils`), which is a private
# path that has moved before and would break on a release where the public name did not.
module = ["transformers.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# vLLM and SGLang are Linux + CUDA wheels with multi-gigabyte dependency trees, and
# the `types` job runs on a CPU runner that deliberately does not install either --
# type checking a plugin must not be contingent on being able to build a serving
# stack. SGLang additionally publishes manylinux-only wheels from 0.5.11 on, so it
# cannot be installed on a developer's Windows or macOS box at all. What the plugins
# borrow from each is checked by tests/test_vllm_*.py and tests/test_sglang_*.py,
# which skip where the framework is absent and run for real where it is not.
module = ["vllm.*", "sglang.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Consequence of the above: every vLLM and SGLang base class reads as `Any` here, and
# `QuantizationConfig`, `LinearMethodBase` and `BasevLLMParameter` are all
# subclassed by design -- that is the entire extension contract.
#
# Scoped to the two framework-facing packages so the rule keeps its teeth everywhere
# else, and `dynquant.integration.serving_common.*` is deliberately not listed: it
# imports no framework, so nothing in it subclasses `Any`, and it stays under full
# strict checking. That is the whole reason the split exists -- see that package's
# docstring.
module = [
    "dynquant.integration.vllm_plugin.*",
    "dynquant.integration.sglang_plugin.*",
]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# Vendored research code is kept verbatim for golden tests; it is not type-clean
# and must not be "fixed" -- that would defeat the purpose of the compat preset.
module = ["dynquant._legacy.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# `--import-mode=importlib` deliberately does not touch `sys.path`, but the DDP tests
# spawn subprocesses that must import `tests.test_signals_reduce` for real; the child
# inherits `sys.path`, so the repo root has to be on it. See tests/__init__.py.
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "cuda: requires a working CUDA device and the compiled dynquant_kernels extension",
    "gpu_slow: long-running GPU benchmark or full-model test (nightly only)",
    "needs_hf: downloads or instantiates a transformers model",
    "golden: reproduces published paper numbers from the vendored research code",
]
filterwarnings = [
    "error::DeprecationWarning:dynquant.*",
]

[tool.coverage.run]
branch = true
source = ["dynquant"]
omit = ["*/_legacy/*", "*/cli.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
