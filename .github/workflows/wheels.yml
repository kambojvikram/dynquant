# Release artifacts: the CUDA wheel matrix, the pure-Python wheels, and the sdists.
#
# Why a matrix at all. A compiled torch extension is valid only next to the torch
# minor it was linked against (libtorch's C++ symbols are mangled and change across
# minors) and the CUDA major it was compiled for. So one source release means one
# wheel per (torch minor x CUDA major.minor x CPython), and PEP 440's local version
# segment is where that is recorded -- exactly as torch does it:
#
#     dynquant_kernels-0.1.0+cu126torch27-cp311-cp311-manylinux_2_34_x86_64.whl
#
# PyPI rejects local versions, so precisely one cell -- the most common combination
# -- is built plain and published there, and every other variant is attached to the
# GitHub Release, which serves as a `pip install --find-links` index. A user on a
# non-default torch either points pip at that index or builds the sdist.
#
# This workflow does not publish anything by itself. See the `publish` job.

name: Wheels

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Also attempt Windows wheels (best effort, may fail)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false      # never cancel a release build half-way

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  # ------------------------------------------------------------------------
  # Source distributions and the two pure-Python wheels
  # ------------------------------------------------------------------------
  sdist:
    name: sdists and pure-Python wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install build tooling
        run: |
          pip install build twine "scikit-build-core>=0.10"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: build
        # The kernels sdist is built with --no-isolation against the CPU torch
        # above; writing a tarball runs no CMake, and an isolated environment would
        # pull the 2.5GB CUDA torch to do nothing with it.
        run: |
          python -m build --outdir dist packages/dynquant-core
          python -m build --outdir dist packages/dynquant
          python -m build --sdist --no-isolation --outdir dist packages/dynquant-kernels

      - run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-pure
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------------
  # The CUDA wheel matrix
  # ------------------------------------------------------------------------
  linux-wheels:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `default: true` is the cell that may go to PyPI: built with no local
          # version segment, so `pip install dynquant-kernels` resolves it. Anyone
          # on a different torch gets an undefined-symbol ImportError, which
          # _loader.py turns into the exact wheel name to install instead -- the
          # accepted cost of PyPI having room for only one variant.
          #
          # Which cell holds it is a user-facing decision, not a tidiness one, and
          # it has a right answer: the cell must pair with the torch that plain
          # `pip install torch` resolves to, because that is the torch sitting next to
          # the kernels in a fresh environment. Today that is 2.13.0, and its own
          # metadata names the CUDA major -- it depends on nvidia-cudnn-**cu13**. So the
          # default cell is cu130 / torch 2.13.
          #
          # 0.5.2 had it on cu126 / torch 2.7, and the damage was not the mismatch the
          # stamper already guards. It is worse, because the guard works: the PyPI wheel
          # pins `torch>=2.7,<2.8`, so `pip install "dynquant[kernels]"` *satisfies* that
          # by downgrading a working torch 2.13 to 2.7.1 -- and torch 2.7.1+cu126
          # supports up to sm_90. On any Blackwell card (RTX 5090, RTX PRO 6000, B200)
          # the install succeeds, the extension dlopens, and the first tensor dies with
          # "no kernel image is available for execution on the device". Measured on an
          # RTX PRO 6000: the +cu128torch28 variant reports `is_available() True` with
          # cubins for 75..120 and a correct GEMV at 2, 3 and 4 bits on the same box
          # where the PyPI cell cannot allocate one.
          #
          # This is also the variant `_loader.py` has been printing as the remedy for a
          # torch mismatch -- `cu130torch213`, named in stamp_kernel_version.py's own
          # docstring as a wheel "the matrix never built". Now it does.
          #
          # Keeping this current is therefore maintenance, not polish: when PyPI's torch
          # moves a minor, this flag moves with it and the old cell stays as a variant.
          #
          # The image's CUDA and `torch_index`'s CUDA must be the *same* version, not
          # merely the same major. `CIBW_REPAIR_WHEEL_COMMAND` below excludes
          # `libcudart.so.*` so the wheel uses torch's bundled runtime; a `_C.so`
          # compiled by nvcc 12.8 against a torch carrying cudart 12.6 can then want a
          # symbol that runtime does not have, and the failure lands on the user at
          # import. So the pairings here are exact, and that requirement -- not
          # preference -- is what selects the images: of the published CUDA manylinux
          # images, only the `manylinux_2_34` family has versions that any torch build
          # actually ships. (The `2_28` family stops at CUDA 12.3, which no torch wheel
          # is built against, so it cannot be paired exactly at all.)
          #
          # Consequence, stated plainly because it is user-visible: these wheels need
          # glibc >= 2.34 -- Ubuntu 22.04, Debian 12, RHEL 9 and newer. Older hosts fall
          # back to the sdist and need a CUDA toolkit. This matches the floor the one
          # manually verified wheel already had (see the P0 notes in CHANGELOG.md);
          # auditwheel refuses to label a wheel with a lower `--plat` than its symbols
          # require, so this cannot silently regress into a mislabelled wheel.
          - label: "cu126 / torch 2.7"
            cuda: "12.6"
            torch: "2.7.1"
            torch_index: "https://download.pytorch.org/whl/cu126"
            image: "sameli/manylinux_2_34_x86_64_cuda_12.6@sha256:be84b5937b2f6e02ee584226e54394976026b5f4489de113d3f2df2171a74b62"
            cibw_build: "cp310-* cp311-* cp312-* cp313-*"
            default: false
          - label: "cu126 / torch 2.6"
            cuda: "12.6"
            torch: "2.6.0"
            torch_index: "https://download.pytorch.org/whl/cu126"
            image: "sameli/manylinux_2_34_x86_64_cuda_12.6@sha256:be84b5937b2f6e02ee584226e54394976026b5f4489de113d3f2df2171a74b62"
            cibw_build: "cp310-* cp311-* cp312-* cp313-*"
            default: false
          - label: "cu128 / torch 2.8"
            cuda: "12.8"
            torch: "2.8.0"
            torch_index: "https://download.pytorch.org/whl/cu128"
            image: "sameli/manylinux_2_34_x86_64_cuda_12.8@sha256:3ff78728c35eb6522a97d1fbf507d7faacfc402df6678ca49cc78a7ba5289bf6"
            cibw_build: "cp310-* cp311-* cp312-* cp313-*"
            default: false
          # The PyPI cell. It is last in the list and newest on purpose -- see the note
          # on `default` above. Digest is the `latest` tag of that image as of this
          # commit; its nvcc is 13.0 and it keeps sm_75, so the architecture ladder in
          # CMakeLists loses nothing by moving up (CUDA 13 drops Maxwell through Volta,
          # which this project has never targeted).
          - label: "cu130 / torch 2.13"
            cuda: "13.0"
            torch: "2.13.0"
            torch_index: "https://download.pytorch.org/whl/cu130"
            image: "sameli/manylinux_2_34_x86_64_cuda_13.0@sha256:1d8f405b2a6565dd94ecca575f44396af62b1d2ad0c85e4b8666e0617d685c8e"
            cibw_build: "cp310-* cp311-* cp312-* cp313-*"
            default: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: free disk space
        # A CUDA manylinux image plus four CPython builds plus a CUDA torch per
        # build overruns the hosted runner's 14GB without this.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: stamp the binary variant into the version and the torch pin
        # --torch goes to both cells, including the plain one. It sets the runtime
        # dependency bound, not just the version label, and the plain cell is the
        # wheel on PyPI -- the one an open bound hurts most. 0.1.0 shipped
        # `torch>=2.4` there, so `pip install dynquant` cheerfully paired a wheel
        # built against torch 2.7 with torch 2.13 and the kernels never loaded.
        run: |
          if [ "${{ matrix.default }}" = "true" ]; then
            python scripts/stamp_kernel_version.py --plain --torch '${{ matrix.torch }}'
          else
            python scripts/stamp_kernel_version.py --cuda '${{ matrix.cuda }}' --torch '${{ matrix.torch }}'
          fi

      - name: build wheels
        # 2.21.3 hardcoded `/opt/python/cp38-cp38/bin/python` as the interpreter it uses
        # to read the container's environment. The manylinux_2_34 CUDA 12.8 image no
        # longer ships a CPython 3.8, so that arm died on `failed with code 127` before
        # compiling a line -- and it was unrelated to `CIBW_BUILD` below, which never
        # asked for 3.8. 2.22.0 moved the probe to cp39. Pinned to the last 2.x rather
        # than 3.x/4.x so this is a version bump and not also a config migration.
        uses: pypa/cibuildwheel@v2.23.4
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          # Linux means manylinux *and* musllinux to cibuildwheel, and the patterns
          # above match `cp310-musllinux_x86_64` just as happily as the manylinux one.
          # There is nothing to build there: torch publishes manylinux_2_28 and
          # win_amd64 wheels and nothing else, so an Alpine build has no torch to
          # compile against or link to, and the musllinux image carries no CUDA toolkit
          # either. Skipping is the correct answer rather than the expedient one.
          #
          # It stayed hidden because musllinux is the *last* thing cibuildwheel
          # attempts: all four manylinux wheels were built and repaired first, and the
          # job then died on exit 127 when CIBW_BEFORE_ALL's `dnf` met an image whose
          # package manager is `apk` -- 26 minutes of good work thrown away at the end.
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS_LINUX: x86_64
          # Third-party CUDA manylinux image, now pinned by digest in the matrix above.
          # These repositories publish only a mutable `latest`, so a tag reference would
          # mean whoever controls it controls the compiler that produces the binaries
          # users run; a digest cannot be moved under us. Building the image ourselves
          # (pypa/manylinux + nvidia/cuda) is still the right end state and removes the
          # dependency rather than pinning it -- tracked for 0.2.
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.image }}
          # --no-isolation so the build sees the exact torch installed below rather
          # than whatever pip resolves as newest. This is the same constraint the
          # kernels pyproject documents; here it is the difference between a wheel
          # that matches its advertised torch minor and one that does not.
          CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
          # Runs once per image, before any build. Two jobs -- the host compiler is
          # pinned in CIBW_ENVIRONMENT below rather than installed here, for the reason
          # in the next paragraph.
          #
          # The host compiler is pinned by absolute path to the image's *system* GCC.
          #
          # It has to be pinned at all because nvcc compiles the host half of every .cu
          # with a host C++ compiler and hard-refuses versions newer than it knows about:
          # CUDA 12.6 caps at GCC 13, these images put GCC 14.2.1 on PATH, and that is
          # what failed the first manylinux_2_34 run with "unsupported GNU version".
          # `-allow-unsupported-compiler` is not the fix -- nvcc's own message says it
          # "may cause compilation failure or incorrect run time execution", which is not
          # a bet to take on numerics kernels. It is also right on its own merits: the
          # host compiler used to be whatever the image happened to default to, so an
          # image rebuild could change code generation under every wheel we ship.
          #
          # The first pin here was `dnf -y install gcc-toolset-13-*`, and it split the
          # matrix in half. The two images are AlmaLinux 9.5 (CUDA 12.6) and 9.7 (CUDA
          # 12.8), so one `dnf` line resolved against two different repository states:
          # 12.6 got a toolset-13 whose `libstdc++_nonshared.a` defines
          # `std::ios_base_library_init()` (GLIBCXX_3.4.32, new in GCC 13) and 12.8 got
          # one that leaves it undefined. Same commit, same command, one clean wheel and
          # one that could not have loaded on the floor this matrix advertises -- the
          # same class of dead wheel as 0.5.0, caught this time by the ABI gate below
          # instead of by users. A compiler fetched over the network at build time is
          # not a pin.
          #
          # `/usr/bin/g++` is GCC 11.5.0 in both images, needs no `dnf`, is accepted by
          # both 12.6 and 12.8 nvcc, and covers the C++17 this project asks for. It is
          # also the only candidate that structurally *cannot* emit either symbol that
          # has killed a wheel here: `__cxa_call_terminate` is GCC 14 and
          # `_ZSt21ios_base_library_initv` is GCC 13. The absolute path is load-bearing
          # -- bare `g++` on PATH is gcc-toolset-14's.
          #
          # Pin auditwheel, for the same reason and with sharper teeth. The images pick
          # its version for us and they disagree: the CUDA 12.6 image (built 2024-12)
          # carries 6.1.0, the CUDA 12.8 one (2026-05) carries 6.6.0. Wildcard
          # `--exclude` arrived in 6.2.0, so on 12.6 the `libcudart.so.*` patterns below
          # matched nothing and auditwheel quietly grafted libcudart, libcublas and
          # libcublasLt into the wheel -- the exact "fails open" outcome those patterns
          # were written to prevent, caught by the verify step rather than by a user.
          # Same version everywhere means same wheel everywhere; it is pinned exactly
          # rather than floored because this is a release pipeline and 6.6.0 is the
          # version that produced the one arm which passed end to end.
          #
          # Then record the toolchain. Five failures here have now come from assuming
          # what a container we do not build contains -- a CUDA version that did not
          # exist, a CPython that had been removed, a GCC too new, a package manager
          # that was apk, an auditwheel too old. So the log states what actually built
          # the binaries, and the next surprise is a grep instead of a bisect.
          CIBW_BEFORE_ALL: |
            set -eux
            /opt/_internal/pipx/venvs/auditwheel/bin/python -m pip install --no-cache-dir auditwheel==6.6.0
            /usr/bin/gcc --version
            /usr/bin/g++ --version
            cat /etc/redhat-release
            /usr/local/cuda/bin/nvcc --version
            auditwheel --version
            ls /opt/python
          CIBW_BEFORE_BUILD: >-
            pip install "scikit-build-core>=0.10" "cmake>=3.26" ninja &&
            pip install torch==${{ matrix.torch }} --index-url ${{ matrix.torch_index }}
          # CUDAHOSTCXX is how CMake initialises CMAKE_CUDA_HOST_COMPILER, and it has to
          # arrive as an environment variable rather than in CMAKE_ARGS: the variable is
          # consumed at `enable_language(CUDA)`, which torch's own cuda.cmake reaches
          # while our find_package(Torch) is still running, so a -D on our command line
          # lands too late to be read. It is the image's own g++, so nothing installs it.
          #
          # CC/CXX matter as much as CUDAHOSTCXX and were missing, which is the whole
          # of the 0.5.0 kernels defect. CUDAHOSTCXX governs only the host half of a
          # `.cu`; every plain `.cpp` -- `bindings.cpp`, where the pybind11 and torch
          # glue lives -- was compiled by whatever the image defaults to, and this image
          # defaults to GCC 14.2.1. The published wheel says so itself:
          # `_build_info.py` records `CXX_COMPILER: "GNU 14.2.1"`.
          #
          # GCC 14 emits `__cxa_call_terminate` on exception-cleanup paths, and
          # libstdc++ only defines it from GCC 14 (CXXABI_1.3.15). Ubuntu 22.04 /
          # Debian 12 / RHEL 9 -- the floor this matrix advertises -- provide 1.3.13. So
          # the wheel installed, imported, and `_C.so` never loaded: users silently got
          # the pure-torch fallback, which is ~60x slower.
          #
          # Nothing caught it. auditwheel reads `.gnu.version_r`, and
          # `__cxa_call_terminate` is *unversioned*, so it is not in that table at all;
          # the wheel's versioned requirements top out at GLIBCXX_3.4.21, which is GCC 5
          # and looks immaculate. A symbol-version policy structurally cannot see this.
          # Hence `abi-smoke` below, which answers the question by dlopening.
          CIBW_ENVIRONMENT: >-
            CUDACXX=/usr/local/cuda/bin/nvcc
            CUDAHOSTCXX=/usr/bin/g++
            CC=/usr/bin/gcc
            CXX=/usr/bin/g++
            CMAKE_ARGS=-DDYNQUANT_REQUIRE_CUDA=ON
          # auditwheel must not vendor libtorch or the CUDA runtime. Bundling them
          # would produce a ~2GB wheel with a second copy of libtorch loaded into
          # the process next to the user's -- two ATen registries, duplicate
          # dispatch keys, and crashes with no line pointing here. torch's own libs
          # are found at runtime because torch is imported first (see _loader.py).
          #
          # The CUDA sonames are wildcards, not `.so.12`. Every cell of this matrix
          # is CUDA 12 today, so a pinned major would work -- and would then fail
          # open the day a CUDA 13 cell is added, because a soname that matches no
          # --exclude gets grafted rather than reported. Silently shipping 400MB of
          # cuBLAS is a worse failure than a broken build.
          #
          # Wildcards need auditwheel >= 6.2.0 (pypa/auditwheel#508), and auditwheel is
          # supplied by the manylinux image rather than by cibuildwheel -- so its version
          # is the image's choice, and one image's choice was 6.1.0. Hence the exact pin
          # in CIBW_BEFORE_ALL above; these patterns are silently inert without it.
          CIBW_REPAIR_WHEEL_COMMAND: >-
            auditwheel repair -w {dest_dir} {wheel}
            --plat manylinux_2_34_x86_64
            --exclude libtorch.so --exclude libtorch_cpu.so --exclude libtorch_cuda.so
            --exclude libtorch_python.so --exclude libc10.so --exclude libc10_cuda.so
            --exclude 'libcudart.so.*' --exclude 'libcublas.so.*'
            --exclude 'libcublasLt.so.*' --exclude 'libcuda.so.*'
          # No test command: the container has no GPU *and* no driver, so importing
          # the extension would fail on libcuda.so.1 regardless of whether the wheel
          # is correct. The metadata checks below are what can honestly be verified
          # here; numerics are the GPU job's business.
          CIBW_TEST_SKIP: "*"
        with:
          package-dir: packages/dynquant-kernels
          output-dir: wheelhouse

      - name: verify every wheel without importing it
        run: |
          python - <<'PY'
          import glob, re, zipfile

          wheels = sorted(glob.glob("wheelhouse/*.whl"))
          assert wheels, "cibuildwheel produced nothing"
          forbidden = ("libtorch", "libc10", "libcudart", "libcublas", "libcuda.so")

          for path in wheels:
              names = zipfile.ZipFile(path).namelist()
              assert any(re.search(r"dynquant_kernels/_C\..*\.so$", n) for n in names), (
                  f"{path} has no compiled extension in it"
              )
              stamp = [n for n in names if n.endswith("dynquant_kernels/_build_info.py")]
              assert stamp, f"{path} has no CMake build stamp"
              text = zipfile.ZipFile(path).read(stamp[0]).decode()
              assert "WITH_CUDA: Final[bool] = bool(1)" in text, (
                  f"{path} was built without CUDA despite DYNQUANT_REQUIRE_CUDA=ON:\n{text}"
              )
              vendored = [n for n in names if any(f in n for f in forbidden)]
              assert not vendored, (
                  f"{path} vendored libraries that must come from the user's torch: {vendored}"
              )
              print(f"ok {path}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cu${{ matrix.cuda }}-torch${{ matrix.torch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # ------------------------------------------------------------------------
  # Windows: best effort, never blocking
  # ------------------------------------------------------------------------
  windows-wheels:
    name: windows (best effort)
    if: inputs.windows
    runs-on: windows-latest
    # MSVC + nvcc on a hosted runner is a long build with several ways to fail that
    # have nothing to do with this code. Windows users are served by the sdist and
    # by the pure-Python core, so a failure here must not fail a release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Kept deliberately in step with the `default: true` cell of linux-wheels. It
      # is a separate hardcoded pairing, so it drifts silently -- and it had, sitting
      # on CUDA 12.6 / torch 2.7 long after that stopped being what anyone installs.
      # A Windows Blackwell owner who took this variant off the Release page got the
      # same dead end the Linux default gave: a wheel whose newest cubin is sm_90.
      #
      # `thrust` is gone from the sub-package list because CUDA 13 folded Thrust and
      # CUB into `cccl`; asking for the old name fails the install outright.
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.0.3"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "cccl", "nvvm", "visual_studio_integration"]'

      - name: build
        run: |
          pip install "scikit-build-core>=0.10" "cmake>=3.26" ninja build
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cu130
          python scripts/stamp_kernel_version.py --cuda 13.0 --torch 2.13.0
          python -m build --wheel --no-isolation --outdir wheelhouse packages/dynquant-kernels

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-py${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # ------------------------------------------------------------------------
  # The only question that matters
  # ------------------------------------------------------------------------
  #
  # Three questions look alike and are not: does the *wheel* install, does the
  # *package* import, does the *`.so`* load. `dynquant_kernels/__init__.py` catches
  # the ImportError and degrades to the torch backend, so the first two answer yes
  # while the artifact is dead -- which is exactly how 0.5.0 shipped.
  #
  # This job answers the third, on the oldest runtime the wheels advertise. The
  # container is the point: `ubuntu:22.04` is glibc 2.35 and libstdc++ 6.0.30
  # (CXXABI_1.3.13), the manylinux_2_34 floor. Building on new and testing on new
  # proves nothing about the floor.
  #
  # No GPU and no driver are needed, contrary to what CIBW_TEST_SKIP above assumes:
  # `objdump -p _C.so` lists no `libcuda.so.1` -- only libtorch and the CUDA runtime
  # torch itself bundles. Numerics still belong on a GPU; *loading* does not.
  abi-smoke:
    name: dlopen on Ubuntu 22.04 (the manylinux_2_34 floor)
    needs: [linux-wheels]
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4

      - name: a python, and proof of the C++ runtime we are testing against
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends             python3 python3-pip python3-venv ca-certificates binutils
          python3 -VV
          echo "libstdc++ here provides up to:"
          strings /usr/lib/x86_64-linux-gnu/libstdc++.so.6             | grep -oE 'CXXABI_1\.3\.[0-9]+' | sort -V | tail -1

      - uses: actions/download-artifact@v4
        with:
          name: wheels-cu13.0-torch2.13.0
          path: wheelhouse

      - name: install the PyPI cell next to the torch it was built against
        # Deliberately from PyPI and not from a download.pytorch.org index. This job
        # exists to reproduce what a user gets from `pip install`, and the whole point
        # of the default cell is that it pairs with the torch PyPI serves. Pointing at
        # the cu130 index here would test a pairing the user never makes and would hide
        # the day PyPI's torch moves on.
        run: |
          set -eux
          python3 -m venv /venv
          /venv/bin/pip install -q --upgrade pip
          /venv/bin/pip install -q torch==2.13.0
          W=$(ls wheelhouse/dynquant_kernels-*cp310-cp310-manylinux*.whl | head -1)
          echo "testing $W"
          /venv/bin/pip install -q "$W"

      - name: dlopen it
        # `import dynquant_kernels` is NOT the test: the shell loads `_C` lazily
        # and catches the ImportError, so it succeeds on a dead wheel.
        #
        # But a bare `from dynquant_kernels import _C` is not the test either.
        # That was the first attempt here and it failed on a *good* wheel, with
        # `ImportError: libtorch.so: cannot open shared object file`. It is a raw
        # submodule import, so it bypasses `_loader.load()` -- and `load()`
        # imports torch before `_C` for a load-bearing reason. `readelf -d`
        # on the built extension lists libtorch.so, libtorch_cpu.so,
        # libtorch_cuda.so, libc10.so, libc10_cuda.so and the CUDA runtime as
        # DT_NEEDED, with **no RUNPATH and no RPATH at all**. That is deliberate:
        # auditwheel is told to exclude those very libraries so the process uses
        # the user's own torch rather than a second vendored copy. Nothing on
        # disk resolves those sonames; what resolves them is that `import torch`
        # has already loaded them into the process. Torch first, then the dlopen.
        #
        # DYNQUANT_KERNELS_STRICT cannot be used here. With no GPU, `load()`
        # returns available=False on its "no available device" branch, which is
        # deliberately not flagged `expected`, so strict mode would fail a
        # perfect wheel on this runner. Everything that *can* be established
        # without a device is asserted explicitly instead: that the operators
        # registered, that the ABI matches, and that CUDA was compiled in.
        run: |
          /venv/bin/python - <<'PY'
          import torch                       # must precede _C -- see above
          import dynquant_kernels as k
          import dynquant_kernels._C as _C   # this line is the dlopen

          print("wheel version :", k.__version__)
          print("_C loaded from:", _C.__file__)

          abi = int(torch.ops.dynquant.abi_version())
          cuda = bool(torch.ops.dynquant.built_with_cuda())
          print("ops registered, abi:", abi, "built_with_cuda:", cuda)

          assert abi == k.ABI_VERSION, f"binary ABI {abi} != shell {k.ABI_VERSION}"
          assert cuda, "wheel reports it was built without CUDA"

          # The other half of "will this run on the user's card", and the half nothing
          # checked. `is_available()` cannot be asserted on this runner -- there is no
          # GPU -- but the arch list is compiled *into* the binary from
          # __CUDA_ARCH_LIST__ and reads back without a device. 0.5.2 shipped a default
          # wheel whose newest cubin was sm_90, three years behind the cards people buy,
          # and every gate was green.
          #
          # sm_75 is deliberately not required: CUDA drops architectures as well as
          # adding them, and Turing is the next one due. Ampere through Blackwell is the
          # range this project claims, so that is the range asserted.
          archs = k.compiled_architectures()
          print("compiled architectures:", archs)
          missing = [sm for sm in (80, 86, 89, 90, 120) if sm not in archs]
          assert not missing, f"default wheel has no cubin for sm_{missing}; got {archs}"
          PY

      - name: and state, by name, what C++ runtime symbols it still needs
        run: |
          W=$(ls wheelhouse/dynquant_kernels-*cp310-cp310-manylinux*.whl | head -1)
          python3 -m zipfile -e "$W" /tmp/ext
          python3 packages/dynquant-kernels/cmake/check_cxx_runtime_abi.py /tmp/ext/dynquant_kernels/_C*.so
        continue-on-error: true

  # ------------------------------------------------------------------------
  # Publication
  # ------------------------------------------------------------------------
  release:
    name: attach to the GitHub Release
    needs: [sdist, linux-wheels, abi-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the only job that needs it
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true

      - name: list what is about to be published
        run: ls -la staged

      - name: attach
        # The Release page doubles as the variant index:
        #   pip install dynquant-kernels==0.1.0+cu124torch26 \
        #     --find-links https://github.com/<org>/dynquant/releases/expanded_assets/<tag>
        uses: softprops/action-gh-release@v2
        with:
          files: staged/*
          fail_on_unmatched_files: true

  # PyPI publication is one job per distribution, each in its own GitHub
  # environment. That is not tidiness -- PyPI forces it. A *pending* trusted
  # publisher is keyed on (owner, repository, workflow, environment) and
  # deliberately NOT on the project name, so one environment can hold exactly one
  # pending publisher. Registering a second name against the same environment
  # fails with "a pending trusted publisher matching this configuration has
  # already been registered for a different project name". Do not collapse these
  # jobs back into one: it cannot be made to work.
  #
  # Register one publisher per name at pypi.org/manage/account/publishing, all
  # sharing owner=kambojvikram, repository=dynquant, workflow=wheels.yml:
  #
  #     dynquant-core      ->  environment  pypi-core
  #     dynquant-kernels   ->  environment  pypi-kernels
  #     dynquant           ->  environment  pypi
  #
  # Each is gated three ways, because this is the one irreversible step in the
  # repository -- a filename cannot be reused on PyPI even after a delete, and
  # this project's source began as a confidential reviewer copy under double-blind
  # review. Nothing fires until someone sets the variable *and* approves the
  # environment.
  #
  # They are chained with `needs:` rather than run in parallel so a dependency is
  # always on PyPI before the thing that pins it: `dynquant` requires
  # `dynquant-core==<this version>` exactly, and with required reviewers the
  # approvals can be minutes apart. Publishing the meta package first would leave
  # `pip install dynquant` unresolvable for that entire window.
  publish-core:
    name: publish dynquant-core to PyPI
    needs: [sdist, linux-wheels, abi-smoke]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi-core
    permissions:
      id-token: write           # trusted publishing; no API token in a secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true
      - name: select dynquant-core artifacts
        env:
          PREFIX: dynquant_core-
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in staged/"$PREFIX"*; do
            case "$(basename "$f")" in
              *+*) echo "skipping local-version artifact $(basename "$f")" ;;
              *)   cp "$f" dist/ ;;
            esac
          done
          ls -la dist
          # An empty dist/ uploads nothing and reports success. A silent no-op
          # release is worse than a red build, so make it red.
          [ -n "$(ls -A dist)" ] || { echo "::error::no $PREFIX artifacts to publish"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-kernels:
    name: publish dynquant-kernels to PyPI
    needs: [publish-core]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi-kernels
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true
      - name: select dynquant-kernels artifacts
        # In practice this is the sdist alone: every built wheel carries a PEP 440
        # local version (0.1.0+cu126torch27) and PyPI rejects those outright, so
        # they are filtered out here and distributed from the Release page instead.
        env:
          PREFIX: dynquant_kernels-
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in staged/"$PREFIX"*; do
            case "$(basename "$f")" in
              *+*) echo "skipping local-version artifact $(basename "$f")" ;;
              *)   cp "$f" dist/ ;;
            esac
          done
          ls -la dist
          # An empty dist/ uploads nothing and reports success. A silent no-op
          # release is worse than a red build, so make it red.
          [ -n "$(ls -A dist)" ] || { echo "::error::no $PREFIX artifacts to publish"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-meta:
    name: publish dynquant to PyPI
    needs: [publish-core, publish-kernels]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true
      - name: select dynquant artifacts
        # `dynquant-` does not match `dynquant_core-` or `dynquant_kernels-`:
        # distribution filenames normalise the name with underscores, so the
        # hyphen here is only ever the name/version separator of the meta package.
        env:
          PREFIX: dynquant-
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in staged/"$PREFIX"*; do
            case "$(basename "$f")" in
              *+*) echo "skipping local-version artifact $(basename "$f")" ;;
              *)   cp "$f" dist/ ;;
            esac
          done
          ls -la dist
          # An empty dist/ uploads nothing and reports success. A silent no-op
          # release is worse than a red build, so make it red.
          [ -n "$(ls -A dist)" ] || { echo "::error::no $PREFIX artifacts to publish"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
