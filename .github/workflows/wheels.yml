# Release artifacts: the CUDA wheel matrix, the pure-Python wheels, and the sdists.
#
# Why a matrix at all. A compiled torch extension is valid only next to the torch
# minor it was linked against (libtorch's C++ symbols are mangled and change across
# minors) and the CUDA major it was compiled for. So one source release means one
# wheel per (torch minor x CUDA major.minor x CPython), and PEP 440's local version
# segment is where that is recorded -- exactly as torch does it:
#
#     dynquant_kernels-0.1.0+cu126torch27-cp311-cp311-manylinux_2_34_x86_64.whl
#
# PyPI rejects local versions, so precisely one cell -- the most common combination
# -- is built plain and published there, and every other variant is attached to the
# GitHub Release, which serves as a `pip install --find-links` index. A user on a
# non-default torch either points pip at that index or builds the sdist.
#
# This workflow does not publish anything by itself. See the `publish` job.

name: Wheels

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Also attempt Windows wheels (best effort, may fail)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false      # never cancel a release build half-way

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  # ------------------------------------------------------------------------
  # Source distributions and the two pure-Python wheels
  # ------------------------------------------------------------------------
  sdist:
    name: sdists and pure-Python wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install build tooling
        run: |
          pip install build twine "scikit-build-core>=0.10"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: build
        # The kernels sdist is built with --no-isolation against the CPU torch
        # above; writing a tarball runs no CMake, and an isolated environment would
        # pull the 2.5GB CUDA torch to do nothing with it.
        run: |
          python -m build --outdir dist packages/dynquant-core
          python -m build --outdir dist packages/dynquant
          python -m build --sdist --no-isolation --outdir dist packages/dynquant-kernels

      - run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-pure
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------------
  # The CUDA wheel matrix
  # ------------------------------------------------------------------------
  linux-wheels:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `default: true` is the cell that may go to PyPI: built with no local
          # version segment, so `pip install dynquant-kernels` resolves it. Anyone
          # on a different torch gets an undefined-symbol ImportError, which
          # _loader.py turns into the exact wheel name to install instead -- the
          # accepted cost of PyPI having room for only one variant.
          #
          # The image's CUDA and `torch_index`'s CUDA must be the *same* version, not
          # merely the same major. `CIBW_REPAIR_WHEEL_COMMAND` below excludes
          # `libcudart.so.*` so the wheel uses torch's bundled runtime; a `_C.so`
          # compiled by nvcc 12.8 against a torch carrying cudart 12.6 can then want a
          # symbol that runtime does not have, and the failure lands on the user at
          # import. So the pairings here are exact, and that requirement -- not
          # preference -- is what selects the images: of the published CUDA manylinux
          # images, only the `manylinux_2_34` family has versions that any torch build
          # actually ships. (The `2_28` family stops at CUDA 12.3, which no torch wheel
          # is built against, so it cannot be paired exactly at all.)
          #
          # Consequence, stated plainly because it is user-visible: these wheels need
          # glibc >= 2.34 -- Ubuntu 22.04, Debian 12, RHEL 9 and newer. Older hosts fall
          # back to the sdist and need a CUDA toolkit. This matches the floor the one
          # manually verified wheel already had (see the P0 notes in CHANGELOG.md);
          # auditwheel refuses to label a wheel with a lower `--plat` than its symbols
          # require, so this cannot silently regress into a mislabelled wheel.
          - label: "cu126 / torch 2.7"
            cuda: "12.6"
            torch: "2.7.1"
            torch_index: "https://download.pytorch.org/whl/cu126"
            image: "sameli/manylinux_2_34_x86_64_cuda_12.6@sha256:be84b5937b2f6e02ee584226e54394976026b5f4489de113d3f2df2171a74b62"
            cibw_build: "cp310-* cp311-* cp312-* cp313-*"
            default: true
          - label: "cu126 / torch 2.6"
            cuda: "12.6"
            torch: "2.6.0"
            torch_index: "https://download.pytorch.org/whl/cu126"
            image: "sameli/manylinux_2_34_x86_64_cuda_12.6@sha256:be84b5937b2f6e02ee584226e54394976026b5f4489de113d3f2df2171a74b62"
            cibw_build: "cp310-* cp311-* cp312-* cp313-*"
            default: false
          - label: "cu128 / torch 2.8"
            cuda: "12.8"
            torch: "2.8.0"
            torch_index: "https://download.pytorch.org/whl/cu128"
            image: "sameli/manylinux_2_34_x86_64_cuda_12.8@sha256:3ff78728c35eb6522a97d1fbf507d7faacfc402df6678ca49cc78a7ba5289bf6"
            cibw_build: "cp310-* cp311-* cp312-* cp313-*"
            default: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: free disk space
        # A CUDA manylinux image plus four CPython builds plus a CUDA torch per
        # build overruns the hosted runner's 14GB without this.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: stamp the binary variant into the version
        run: |
          if [ "${{ matrix.default }}" = "true" ]; then
            python scripts/stamp_kernel_version.py --plain
          else
            python scripts/stamp_kernel_version.py --cuda '${{ matrix.cuda }}' --torch '${{ matrix.torch }}'
          fi

      - name: build wheels
        # 2.21.3 hardcoded `/opt/python/cp38-cp38/bin/python` as the interpreter it uses
        # to read the container's environment. The manylinux_2_34 CUDA 12.8 image no
        # longer ships a CPython 3.8, so that arm died on `failed with code 127` before
        # compiling a line -- and it was unrelated to `CIBW_BUILD` below, which never
        # asked for 3.8. 2.22.0 moved the probe to cp39. Pinned to the last 2.x rather
        # than 3.x/4.x so this is a version bump and not also a config migration.
        uses: pypa/cibuildwheel@v2.23.4
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_ARCHS_LINUX: x86_64
          # Third-party CUDA manylinux image, now pinned by digest in the matrix above.
          # These repositories publish only a mutable `latest`, so a tag reference would
          # mean whoever controls it controls the compiler that produces the binaries
          # users run; a digest cannot be moved under us. Building the image ourselves
          # (pypa/manylinux + nvidia/cuda) is still the right end state and removes the
          # dependency rather than pinning it -- tracked for 0.2.
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.image }}
          # --no-isolation so the build sees the exact torch installed below rather
          # than whatever pip resolves as newest. This is the same constraint the
          # kernels pyproject documents; here it is the difference between a wheel
          # that matches its advertised torch minor and one that does not.
          CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
          # Runs once per image, before any build. Two jobs.
          #
          # Pin the host compiler. nvcc compiles the host half of every .cu with a host
          # C++ compiler, and it hard-refuses versions newer than it knows about: CUDA
          # 12.6 caps at GCC 13, this image defaults to GCC 14.2.1, and that is what
          # failed the first manylinux_2_34 run with "unsupported GNU version".
          # `-allow-unsupported-compiler` is not the fix -- nvcc's own message says it
          # "may cause compilation failure or incorrect run time execution", which is not
          # a bet to take on numerics kernels. GCC 13 is accepted by both 12.6 and 12.8,
          # so one pin covers the matrix. This is right on its own merits regardless of
          # the failure: the host compiler used to be whatever the image happened to
          # default to, so an image rebuild could change code generation under every
          # wheel we ship, silently.
          #
          # Then record the toolchain. Three separate failures here have now come from
          # assuming what is inside a third-party image -- a CUDA version that did not
          # exist, a CPython that had been removed, a GCC that was too new. So the log
          # states what actually built the binaries, and the next surprise is a grep
          # instead of a bisect.
          CIBW_BEFORE_ALL: |
            set -eux
            dnf -y install gcc-toolset-13-gcc gcc-toolset-13-gcc-c++
            /opt/rh/gcc-toolset-13/root/usr/bin/g++ --version
            /usr/local/cuda/bin/nvcc --version
            auditwheel --version || true
            ls /opt/python || true
          CIBW_BEFORE_BUILD: >-
            pip install "scikit-build-core>=0.10" "cmake>=3.26" ninja &&
            pip install torch==${{ matrix.torch }} --index-url ${{ matrix.torch_index }}
          # CUDAHOSTCXX is how CMake initialises CMAKE_CUDA_HOST_COMPILER, and it has to
          # arrive as an environment variable rather than in CMAKE_ARGS: the variable is
          # consumed at `enable_language(CUDA)`, which torch's own cuda.cmake reaches
          # while our find_package(Torch) is still running, so a -D on our command line
          # lands too late to be read. Installed by CIBW_BEFORE_ALL above.
          CIBW_ENVIRONMENT: >-
            CUDACXX=/usr/local/cuda/bin/nvcc
            CUDAHOSTCXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++
            CMAKE_ARGS=-DDYNQUANT_REQUIRE_CUDA=ON
          # auditwheel must not vendor libtorch or the CUDA runtime. Bundling them
          # would produce a ~2GB wheel with a second copy of libtorch loaded into
          # the process next to the user's -- two ATen registries, duplicate
          # dispatch keys, and crashes with no line pointing here. torch's own libs
          # are found at runtime because torch is imported first (see _loader.py).
          #
          # The CUDA sonames are wildcards, not `.so.12`. Every cell of this matrix
          # is CUDA 12 today, so a pinned major would work -- and would then fail
          # open the day a CUDA 13 cell is added, because a soname that matches no
          # --exclude gets grafted rather than reported. Silently shipping 400MB of
          # cuBLAS is a worse failure than a broken build.
          #
          # Wildcards need auditwheel >= 5.4, and auditwheel is supplied by the manylinux
          # image, not by cibuildwheel -- so it is a third thing whose version the image
          # chooses for us, which is why CIBW_BEFORE_ALL prints it.
          CIBW_REPAIR_WHEEL_COMMAND: >-
            auditwheel repair -w {dest_dir} {wheel}
            --plat manylinux_2_34_x86_64
            --exclude libtorch.so --exclude libtorch_cpu.so --exclude libtorch_cuda.so
            --exclude libtorch_python.so --exclude libc10.so --exclude libc10_cuda.so
            --exclude 'libcudart.so.*' --exclude 'libcublas.so.*'
            --exclude 'libcublasLt.so.*' --exclude 'libcuda.so.*'
          # No test command: the container has no GPU *and* no driver, so importing
          # the extension would fail on libcuda.so.1 regardless of whether the wheel
          # is correct. The metadata checks below are what can honestly be verified
          # here; numerics are the GPU job's business.
          CIBW_TEST_SKIP: "*"
        with:
          package-dir: packages/dynquant-kernels
          output-dir: wheelhouse

      - name: verify every wheel without importing it
        run: |
          python - <<'PY'
          import glob, re, zipfile

          wheels = sorted(glob.glob("wheelhouse/*.whl"))
          assert wheels, "cibuildwheel produced nothing"
          forbidden = ("libtorch", "libc10", "libcudart", "libcublas", "libcuda.so")

          for path in wheels:
              names = zipfile.ZipFile(path).namelist()
              assert any(re.search(r"dynquant_kernels/_C\..*\.so$", n) for n in names), (
                  f"{path} has no compiled extension in it"
              )
              stamp = [n for n in names if n.endswith("dynquant_kernels/_build_info.py")]
              assert stamp, f"{path} has no CMake build stamp"
              text = zipfile.ZipFile(path).read(stamp[0]).decode()
              assert "WITH_CUDA: Final[bool] = bool(1)" in text, (
                  f"{path} was built without CUDA despite DYNQUANT_REQUIRE_CUDA=ON:\n{text}"
              )
              vendored = [n for n in names if any(f in n for f in forbidden)]
              assert not vendored, (
                  f"{path} vendored libraries that must come from the user's torch: {vendored}"
              )
              print(f"ok {path}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cu${{ matrix.cuda }}-torch${{ matrix.torch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # ------------------------------------------------------------------------
  # Windows: best effort, never blocking
  # ------------------------------------------------------------------------
  windows-wheels:
    name: windows (best effort)
    if: inputs.windows
    runs-on: windows-latest
    # MSVC + nvcc on a hosted runner is a long build with several ways to fail that
    # have nothing to do with this code. Windows users are served by the sdist and
    # by the pure-Python core, so a failure here must not fail a release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      - name: build
        run: |
          pip install "scikit-build-core>=0.10" "cmake>=3.26" ninja build
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cu126
          python scripts/stamp_kernel_version.py --cuda 12.6 --torch 2.7.1
          python -m build --wheel --no-isolation --outdir wheelhouse packages/dynquant-kernels

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-py${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # ------------------------------------------------------------------------
  # Publication
  # ------------------------------------------------------------------------
  release:
    name: attach to the GitHub Release
    needs: [sdist, linux-wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the only job that needs it
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true

      - name: list what is about to be published
        run: ls -la staged

      - name: attach
        # The Release page doubles as the variant index:
        #   pip install dynquant-kernels==0.1.0+cu124torch26 \
        #     --find-links https://github.com/<org>/dynquant/releases/expanded_assets/<tag>
        uses: softprops/action-gh-release@v2
        with:
          files: staged/*
          fail_on_unmatched_files: true

  # PyPI publication is one job per distribution, each in its own GitHub
  # environment. That is not tidiness -- PyPI forces it. A *pending* trusted
  # publisher is keyed on (owner, repository, workflow, environment) and
  # deliberately NOT on the project name, so one environment can hold exactly one
  # pending publisher. Registering a second name against the same environment
  # fails with "a pending trusted publisher matching this configuration has
  # already been registered for a different project name". Do not collapse these
  # jobs back into one: it cannot be made to work.
  #
  # Register one publisher per name at pypi.org/manage/account/publishing, all
  # sharing owner=kambojvikram, repository=dynquant, workflow=wheels.yml:
  #
  #     dynquant-core      ->  environment  pypi-core
  #     dynquant-kernels   ->  environment  pypi-kernels
  #     dynquant           ->  environment  pypi
  #
  # Each is gated three ways, because this is the one irreversible step in the
  # repository -- a filename cannot be reused on PyPI even after a delete, and
  # this project's source began as a confidential reviewer copy under double-blind
  # review. Nothing fires until someone sets the variable *and* approves the
  # environment.
  #
  # They are chained with `needs:` rather than run in parallel so a dependency is
  # always on PyPI before the thing that pins it: `dynquant` requires
  # `dynquant-core==<this version>` exactly, and with required reviewers the
  # approvals can be minutes apart. Publishing the meta package first would leave
  # `pip install dynquant` unresolvable for that entire window.
  publish-core:
    name: publish dynquant-core to PyPI
    needs: [sdist, linux-wheels]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi-core
    permissions:
      id-token: write           # trusted publishing; no API token in a secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true
      - name: select dynquant-core artifacts
        env:
          PREFIX: dynquant_core-
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in staged/"$PREFIX"*; do
            case "$(basename "$f")" in
              *+*) echo "skipping local-version artifact $(basename "$f")" ;;
              *)   cp "$f" dist/ ;;
            esac
          done
          ls -la dist
          # An empty dist/ uploads nothing and reports success. A silent no-op
          # release is worse than a red build, so make it red.
          [ -n "$(ls -A dist)" ] || { echo "::error::no $PREFIX artifacts to publish"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-kernels:
    name: publish dynquant-kernels to PyPI
    needs: [publish-core]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi-kernels
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true
      - name: select dynquant-kernels artifacts
        # In practice this is the sdist alone: every built wheel carries a PEP 440
        # local version (0.1.0+cu126torch27) and PyPI rejects those outright, so
        # they are filtered out here and distributed from the Release page instead.
        env:
          PREFIX: dynquant_kernels-
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in staged/"$PREFIX"*; do
            case "$(basename "$f")" in
              *+*) echo "skipping local-version artifact $(basename "$f")" ;;
              *)   cp "$f" dist/ ;;
            esac
          done
          ls -la dist
          # An empty dist/ uploads nothing and reports success. A silent no-op
          # release is worse than a red build, so make it red.
          [ -n "$(ls -A dist)" ] || { echo "::error::no $PREFIX artifacts to publish"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-meta:
    name: publish dynquant to PyPI
    needs: [publish-core, publish-kernels]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true
      - name: select dynquant artifacts
        # `dynquant-` does not match `dynquant_core-` or `dynquant_kernels-`:
        # distribution filenames normalise the name with underscores, so the
        # hyphen here is only ever the name/version separator of the meta package.
        env:
          PREFIX: dynquant-
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in staged/"$PREFIX"*; do
            case "$(basename "$f")" in
              *+*) echo "skipping local-version artifact $(basename "$f")" ;;
              *)   cp "$f" dist/ ;;
            esac
          done
          ls -la dist
          # An empty dist/ uploads nothing and reports success. A silent no-op
          # release is worse than a red build, so make it red.
          [ -n "$(ls -A dist)" ] || { echo "::error::no $PREFIX artifacts to publish"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
