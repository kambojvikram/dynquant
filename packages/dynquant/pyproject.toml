# The user-facing install: `pip install dynquant`.
#
# This distribution contains no code. Its entire job is to be the one name people
# type and to pull in the pieces that make the kernels present by default -- the
# thing that separates "a quantization library" from "a research script you have to
# compile yourself".
#
# Why a meta-package at all, instead of putting everything in one wheel:
#
#   * The compiled half is ~one wheel per (CUDA major x torch minor x Python x
#     platform). Fusing it with the Python half would mean re-releasing the
#     allocator every time a torch point release lands.
#   * The Python half has to install where there is no compiler and no GPU --
#     Windows, macOS, ARM, CPU CI. `dynquant-core` alone always installs, and the
#     quantization pipeline is fully usable there. Only inference speed needs the
#     binary.
#
# Version numbers move in lockstep with `dynquant-core` (tests/test_packaging.py
# enforces it), so `dynquant==X` and `dynquant-core==X` always mean the same code.

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dynquant"
version = "0.5.2"
description = "Training-dynamics-driven mixed-precision LLM quantization, with prebuilt CUDA kernels."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "DynQuant authors" }]
keywords = ["quantization", "llm", "transformers", "mixed-precision", "moe", "compression", "cuda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU :: NVIDIA CUDA",
]

dependencies = [
    "dynquant-core==0.5.2",
    # The prebuilt kernels are NOT here, and that is the fix for the defect that
    # cost 0.5.0 its install story. See `[project.optional-dependencies] kernels`.
    #
    # `dynquant-kernels` is a compiled extension linked against one torch minor's
    # C++ ABI, so its wheel declares a narrow runtime pin (`torch>=2.7,<2.8` for
    # the 0.5.0 PyPI cell). PyPI accepts exactly one cell of the build matrix --
    # local version segments are rejected outright -- so there is exactly one torch
    # minor that cell is compatible with, and everyone else is a conflict.
    #
    # A conflict is not what pip reports. Listing the kernels here made it a hard
    # requirement, and pip resolved it the only way a hard requirement can be
    # resolved: by *downgrading the user's torch*. On a machine carrying
    # torch 2.13.0+cu130, `pip install dynquant` silently installed torch 2.7.1+cu126
    # underneath it, left torchvision compiled against the outgoing version, and the
    # next `import transformers` died with
    #
    #     RuntimeError: operator torchvision::nms does not exist
    #     ModuleNotFoundError: Could not import module 'MistralForCausalLM'
    #
    # -- an error that names a model class, from a command that reported success, for
    # a cause that is neither. Installing a quantization library must never move the
    # framework it quantizes for.
    #
    # PEP 508 cannot express "only if it does not move torch": there is no
    # environment marker for the version of an installed distribution, so the
    # requirement is either unconditional or absent. Absent is the only safe answer.
    # `dynquant-core` alone declares an open `torch>=2.4`, so the default install now
    # constrains nothing, and `dynquant doctor` reports backend=torch with the exact
    # command to add the kernels for the torch actually present.
]

[project.optional-dependencies]
# Mirrors of dynquant-core's extras, so users never have to know that `core`
# exists as a separate name.
hf = ["dynquant-core[hf]==0.5.2"]
train = ["dynquant-core[train]==0.5.2"]
eval = ["dynquant-core[eval]==0.5.2"]
triton = ["dynquant-core[triton]==0.5.2"]
dev = ["dynquant-core[dev]==0.5.2"]

# The compiled kernels, opt-in. This is the one place the binary is requested, and
# it is an extra rather than a dependency because asking for it can force a torch
# change -- see the note in `dependencies` above. As an extra that change is a
# thing the user typed, not a thing that happened to them.
#
# Still marker-free, so it works on platforms with no published wheel too: there it
# falls back to an sdist build, which needs nvcc, cmake >= 3.26 and a C++ toolchain.
# Whether a *prebuilt* wheel exists is declared once, below, under [tool.dynquant].
kernels = ["dynquant-kernels>=0.1.1,<0.6"]

[project.urls]
# See the note in dynquant-core: no Documentation key until the site exists.
Homepage = "https://github.com/kambojvikram/dynquant"
Issues = "https://github.com/kambojvikram/dynquant/issues"
Changelog = "https://github.com/kambojvikram/dynquant/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
# No code to ship. Hatchling refuses to build a wheel with nothing in it unless
# told that is the intent.
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["README.md", "LICENSE", "pyproject.toml"]

[tool.dynquant]
# The platforms a prebuilt `dynquant-kernels` wheel is published for.
#
# This used to be an environment marker on the dependency above, and `dynquant
# doctor` mirrored it in `runtime/backend.py:_prebuilt_wheel_exists` so it would
# never tell a user on a wheel-less platform to run an install that declines to
# give them one. Removing the dependency removed the marker, but not the question
# it answered, so the fact is declared here instead of being inferred from a
# requirement whose presence had a side effect nobody wanted.
#
# tests/test_packaging.py evaluates this against synthetic environments and
# requires the doctor's predicate to agree on every one.
prebuilt-wheel-marker = "platform_system=='Linux' and platform_machine=='x86_64'"
